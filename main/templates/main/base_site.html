{% load static %}
<!DOCTYPE html>
<html lang="fr-CD">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include 'main/seo_head.html' %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    {% if page_schema %}
    <script type="application/ld+json">{{ page_schema|safe }}</script>
    {% endif %}
    {% block extra_head %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
    {% include 'main/navbar.html' %}

    {% block content %}{% endblock %}

    {% include 'main/footer.html' %}

    <div class="mobile-cta-bar" aria-label="Actions rapides">
        <a href="{% url 'inscription' %}" class="btn btn-primary rounded-pill">Rejoindre</a>
        <a href="{% url 'announcements:announcement_list' %}" class="btn btn-outline-primary rounded-pill">Sessions</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
