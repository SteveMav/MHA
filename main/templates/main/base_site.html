{% load static %}
<!DOCTYPE html>
<html lang="fr-CD">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include 'main/seo_head.html' %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    {% if page_schema %}
    <script type="application/ld+json">{{ page_schema|safe }}</script>
    {% endif %}
    {% block extra_head %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
    {% include 'main/navbar.html' %}

    {% block content %}{% endblock %}

    {% include 'main/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var navOffcanvas = document.getElementById('navbarOffcanvas');
            if (navOffcanvas) {
                var links = navOffcanvas.querySelectorAll('a');
                links.forEach(function (link) {
                    link.addEventListener('click', function () {
                        var href = link.getAttribute('href');
                        // Fermer automatiquement le tiroir au clic sur un lien interne ou anchor
                        if (href && (href.indexOf('#') !== -1 || !href.startsWith('http'))) {
                            var bsOffcanvas = bootstrap.Offcanvas.getInstance(navOffcanvas);
                            if (bsOffcanvas) {
                                bsOffcanvas.hide();
                            }
                        }
                    });
                });
            }
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
