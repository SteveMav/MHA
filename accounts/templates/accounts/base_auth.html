{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Magic Hoops Academy{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        body {
            background-color: var(--paper);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: var(--font-body);
        }

        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
        }

        .auth-card {
            background: var(--surface);
            border-radius: 28px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow-soft);
            padding: clamp(1.75rem, 4vw, 2.5rem);
            width: 100%;
            max-width: 480px;
        }

        .auth-logo {
            width: 72px;
            height: auto;
            border-radius: 50%;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

    <!-- Simple Navbar -->
    <nav class="navbar navbar-light bg-white site-navbar">
        <div class="container justify-content-between">
            <a class="navbar-brand fw-bold text-primary d-flex align-items-center" href="{% url 'index' %}">
                <img src="{% static 'images/mha_logo.jpeg' %}" alt="MHA Logo" height="42" class="me-2 rounded-circle">
                <span>Magic Hoops Academy</span>
            </a>
            <a href="{% url 'index' %}" class="btn btn-outline-primary btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i> Retour au site
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="auth-container">
        <div class="container d-flex justify-content-center">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <!-- Simple Footer -->
    <footer class="bg-white py-3 text-center text-muted border-top mt-auto">
        <div class="container">
            <small>&copy; {% now "Y" %} Magic Hoops Academy. Tous droits réservés.</small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
