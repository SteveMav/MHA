{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Magic Hoops Academy{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        body {
            background-color: var(--paper);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: var(--font-body);
        }

        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
        }

        .auth-card {
            background: var(--surface);
            border-radius: 8px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow-soft);
            padding: clamp(1.75rem, 4vw, 2.5rem);
            width: 100%;
            max-width: 480px;
        }

        .auth-logo {
            width: 72px;
            height: auto;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

    <!-- Brand Header -->
    <header class="home-nav" style="background: #ffffff; border-bottom: 1px solid var(--line);">
        <div class="home-wrap" style="display: flex; justify-content: space-between; align-items: center; padding-top: 14px; padding-bottom: 14px;">
            <a class="home-brand" href="{% url 'index' %}" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
                <img src="{% static 'images/mha_logo.jpeg' %}" alt="Logo Magic Hoops Academy Kinshasa" style="width: 36px; height: 36px; border-radius: 6px; object-fit: cover;">
                <span style="display: flex; flex-direction: column; line-height: 1.15;">
                    <span style="font-family: var(--font-heading); font-weight: 800; font-size: 15px; letter-spacing: -.02em; color: var(--secondary-color);">Magic Hoops</span>
                    <span style="font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .02em;">Academy · Kinshasa</span>
                </span>
            </a>
            <a href="{% url 'index' %}" class="home-link" style="font-size: 13px;">
                ← Retour au site
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <div class="auth-container">
        <div class="home-wrap" style="display: flex; justify-content: center; width: 100%;">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <!-- Simple Footer -->
    <footer style="background: #ffffff; padding: 16px 20px; text-align: center; color: var(--muted); border-top: 1px solid var(--line); margin-top: auto; font-size: 13px;">
        <div class="home-wrap">
            <span>&copy; {% now "Y" %} Magic Hoops Academy · Kinshasa (RDC). Tous droits réservés.</span>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
